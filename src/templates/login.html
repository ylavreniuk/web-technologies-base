<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="{{ url_for('static', path='js/script.js') }}" defer></script>
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Вхід у систему</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="username-input" class="form-label">Ім’я користувача:</label>
                                <input type="text" class="form-control" id="username-input"
                                    placeholder="Введіть ім’я користувача">
                            </div>
                            <div class="mb-3">
                                <label for="password-input" class="form-label">Пароль:</label>
                                <input type="password" class="form-control" id="password-input"
                                    placeholder="Введіть пароль">
                            </div>
                            <button type="submit" class="btn btn-primary">Увійти</button>
                        </form>
                        <div id="login-message" class="mt-3"></div>
                        <p class="mt-3">Немає акаунту? <a href="/register">Зареєструватися</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
