<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профіль користувача</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="{{ url_for('static', path='js/script.js') }}" defer></script>
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Профіль користувача</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h3 class="card-title" id="username"></h3>
                        <button id="logout-btn" class="btn btn-danger mt-3">Вийти</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="row justify-content-center mt-4">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4 class="card-title">Надіслати повідомлення</h4>
                        <form id="submission-form">
                            <div class="mb-3">
                                <label for="name-input" class="form-label">Ім’я:</label>
                                <input type="text" class="form-control" id="name-input" placeholder="Введіть ім’я">
                            </div>
                            <div class="mb-3">
                                <label for="email-input" class="form-label">Email:</label>
                                <input type="email" class="form-control" id="email-input" placeholder="Введіть email">
                            </div>
                            <div class="mb-3">
                                <label for="message-input" class="form-label">Повідомлення:</label>
                                <textarea class="form-control" id="message-input"
                                    placeholder="Введіть повідомлення"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Надіслати</button>
                        </form>
                        <div id="form-message" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
