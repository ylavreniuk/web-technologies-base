<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профіль користувача</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Профіль користувача</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <img src="https://via.placeholder.com/150" class="card-img-top rounded-circle mx-auto mt-3"
                        alt="Фото профілю" style="width: 150px; height: 150px;">
                    <div class="card-body text-center">
                        <h3 class="card-title">{{ user.name }}</h3>
                        <p class="card-text"><strong>Email:</strong> {{ user.email }}</p>
                        <p class="card-text"><strong>Роль:</strong> {{ user.role }}</p>
                        <p class="card-text"><strong>Біо:</strong> {{ user.bio }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
{% if user.is_authenticated %}
<div class="text-center mt-4">
    <a href="/logout" class="btn btn-danger">Вийти</a>
</div>
{% else %}
<div class="text-center mt-4">
    <a href="/login" class="btn btn-primary">Увійти</a>
</div>
{% endif %}
